<body>
<div class="min-h-screen bg-canvas text-ink">
  <div class="h-1 bg-forest"></div>
  <main class="mx-auto w-full max-w-3xl px-4 pb-24 pt-8 sm:px-6 sm:pt-12">
    <header class="flex items-start justify-between gap-4">
      <div class="flex items-center gap-3">
        <span aria-hidden="true" class="grid size-12 shrink-0 place-items-center rounded-2xl bg-forest font-serif text-2xl text-gold-soft">A</span>
        <div>
          <p class="text-xs font-medium uppercase tracking-widest text-gold">Carteira privada</p>
          <h1 class="font-serif text-4xl leading-none tracking-tight text-forest">Aureum</h1>
        </div>
      </div>
      <p id="hoje-label" class="max-w-40 pt-1 text-right text-sm leading-snug text-muted"></p>
    </header>

    <div id="notice"></div>

    <p class="mt-10 text-xs font-medium uppercase tracking-widest text-muted">Posição</p>
    <section id="kpis" class="mt-3 grid gap-3 sm:grid-cols-3" aria-label="Posição da carteira"></section>

    <div class="mt-6 flex flex-col gap-2 sm:flex-row">
      <button type="button" data-action="novo" class="inline-flex items-center justify-center gap-2 rounded-full text-sm font-medium transition-colors disabled:cursor-not-allowed disabled:opacity-60 h-12 px-4 sm:flex-1 bg-forest text-paper hover:bg-forest-deep"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Novo contrato</button>
      <button type="button" data-action="extrato-resumo" class="inline-flex items-center justify-center gap-2 rounded-full text-sm font-medium transition-colors disabled:cursor-not-allowed disabled:opacity-60 h-12 px-4 sm:flex-1 border border-line bg-paper text-ink hover:border-forest"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>Extrato resumido</button>
      <button type="button" data-action="extrato-completo" class="inline-flex items-center justify-center gap-2 rounded-full text-sm font-medium transition-colors disabled:cursor-not-allowed disabled:opacity-60 h-12 px-4 sm:flex-1 border border-line bg-paper text-ink hover:border-forest"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></svg>Extrato completo</button>
    </div>

    <form id="form-contrato" style="display:none" class="mt-4 rounded-3xl border border-line bg-paper p-4 sm:p-6" novalidate>
      <h2 class="font-serif text-2xl tracking-tight text-ink">Novo contrato</h2>
      <p class="mt-1 text-sm text-muted">As parcelas nascem da data de início, no ritmo diário ou semanal.</p>
      <div class="mt-5 grid gap-3 sm:grid-cols-2">
        <label class="block sm:col-span-2"><span class="mb-1 block text-xs font-medium uppercase tracking-wider text-muted">Nome do cliente</span>
          <input id="contrato-nome" name="nome" class="h-12 w-full rounded-xl border border-line bg-canvas px-3 text-base text-ink outline-none focus:border-forest" autocomplete="name"></label>
        <label class="block"><span class="mb-1 block text-xs font-medium uppercase tracking-wider text-muted">Valor total</span>
          <input id="contrato-valor" name="valor" class="h-12 w-full rounded-xl border border-line bg-canvas px-3 text-base text-ink outline-none focus:border-forest" inputmode="decimal"></label>
        <label class="block"><span class="mb-1 block text-xs font-medium uppercase tracking-wider text-muted">Início</span>
          <input id="contrato-data" name="data" class="h-12 w-full rounded-xl border border-line bg-canvas px-3 text-base text-ink outline-none focus:border-forest" type="date"></label>
        <label class="block"><span class="mb-1 block text-xs font-medium uppercase tracking-wider text-muted">Parcelas</span>
          <input id="contrato-parcelas" name="parcelas" class="h-12 w-full rounded-xl border border-line bg-canvas px-3 text-base text-ink outline-none focus:border-forest" inputmode="numeric"></label>
        <label class="block"><span class="mb-1 block text-xs font-medium uppercase tracking-wider text-muted">Periodicidade</span>
          <select id="contrato-tipo" name="tipo" class="h-12 w-full rounded-xl border border-line bg-canvas px-3 text-base text-ink outline-none focus:border-forest">
            <option value="diario">Diário</option>
            <option value="semanal">Semanal</option>
          </select></label>
        <label class="flex min-h-12 items-center gap-3 text-sm text-ink sm:col-span-2">
          <input type="checkbox" name="excetoDomingo" class="size-4 accent-forest">
          Não cobrar aos domingos
        </label>
      </div>
      <p id="form-error" role="alert" class="mt-3 text-sm text-burgundy" style="display:none"></p>

    <footer class="mt-16 border-t border-line pt-6 text-center text-xs leading-relaxed text-muted">

<script>
(function () {
  "use strict";

  /* ============ Finance (lógica) ============ */
  var STORAGE_KEY = "clientes";

  function criarData(s) {
    var p = s.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
  }
  function dayStamp(v) {
    var d = v instanceof Date ? new Date(v.getTime()) : new Date(v);
    if (isNaN(d.getTime())) return NaN;
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  function money(v) {
    var n = isFinite(v) ? v : 0;
    return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  function formatDate(v) {
    var d = new Date(v);
    if (isNaN(d.getTime())) return "—";
    return d.toLocaleDateString("pt-BR");
  }
  function formatInputDate(s) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return criarData(s).toLocaleDateString("pt-BR");
    return formatDate(s);
  }
  function labelTipo(t) { return t === "diario" ? "Diário" : "Semanal"; }
  function todayInputValue(date) {
    date = date || new Date();
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, "0");
    var d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }
  function formatHoje(date) {
    var t = (date || new Date()).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function gerarParcelas(c) {
    var data = criarData(c.data);
    var valorParcela = c.valor / c.parcelas;
    var lista = [];
    for (var i = 1; i <= c.parcelas; i++) {
      if (c.tipo === "diario" && c.excetoDomingo) {
        while (data.getDay() === 0) data.setDate(data.getDate() + 1);
      }
      lista.push({ numero: i, data: new Date(data.getTime()).toISOString(), valor: valorParcela, pago: false });
      if (c.tipo === "diario") data.setDate(data.getDate() + 1);
      else data.setDate(data.getDate() + 7);
    }
    return lista;
  }
  function recalcular(c) {
    var lista = c.lista.map(function (p, i) { return Object.assign({}, p, { numero: i + 1 }); });
    return Object.assign({}, c, {
      lista: lista,
      parcelas: lista.length,
      valor: lista.reduce(function (s, p) { return s + p.valor; }, 0)
    });
  }
  function adicionarParcelaFim(c) {
    if (c.lista.length === 0) return null;
    var ultima = c.lista[c.lista.length - 1];
    if (!ultima) return null;
    var nova = new Date(ultima.data);
    if (c.tipo === "diario") {
      nova.setDate(nova.getDate() + 1);
      if (c.excetoDomingo && nova.getDay() === 0) nova.setDate(nova.getDate() + 1);
    } else {

    if (open) {
      h += '<div class="border-t border-line"><ul>';
      c.lista.forEach(function (p, pIdx) {
        var status = statusParcela(p, hojeStamp);
        var hojeP = status === "pendente" && dayEquals(p.data, hojeStamp);
        h += '<li class="' + cn("border-t border-line px-4 py-4 first:border-t-0 sm:px-5",
          status === "atrasado" && "bg-burgundy-soft", hojeP && "bg-gold-soft") + '">';
        h += '<div class="flex items-start gap-3"><span class="w-8 shrink-0 pt-0.5 font-serif text-lg tabular-nums text-muted">' +
          String(p.numero).padStart(2, "0") + "</span>";
        h += '<div class="min-w-0 flex-1"><div class="flex items-baseline justify-between gap-3"><p class="text-sm text-ink">' +
          formatDate(p.data) + '</p><p class="font-serif text-lg tabular-nums text-ink">' + money(p.valor) + "</p></div>";
        h += '<p class="' + cn("mt-1 text-xs font-medium uppercase tracking-wider", tone(status)) + '">' + STATUS_LABEL[status] + (p.parcial ? " parcial" : "") + "</p>";
        if (p.parcial) h += '<p class="mt-1 text-xs text-muted">Pagou ' + money(p.valor) + " de " + money(p.parcial.original) + " · " + money(p.parcial.resto) + " passou para a próxima parcela</p>";
        if (p.acum && !p.pago) h += '<p class="mt-1 text-xs text-muted">Inclui ' + money(p.acum) + " acumulado da parcela anterior</p>";
        h += '<div class="mt-3 flex flex-wrap gap-2">';
        if (p.pago) {
          h += btn({ variant: "alert", size: "sm", attrs: 'data-action="reverse" data-c="' + cIdx + '" data-p="' + pIdx + '"' }, "Estornar");
        } else {
          h += btn({ variant: "primary", size: "sm", attrs: 'data-action="pay" data-c="' + cIdx + '" data-p="' + pIdx + '"' }, "Pagar");
          h += btn({ size: "sm", attrs: 'data-action="parcial" data-c="' + cIdx + '" data-p="' + pIdx + '"' }, "Pagou menos");
          h += btn({ size: "sm", attrs: 'data-action="remove" data-c="' + cIdx + '" data-p="' + pIdx + '"' }, "Feriado");
        }
        h += "</div></div></div></li>";
      });
      h += "</ul>";
      h += '<div class="border-t border-line p-4 sm:p-5"><div class="grid gap-2">' +
        btn({ cls: "w-full", attrs: 'data-action="add" data-c="' + cIdx + '"' }, "Adicionar parcela ao final") +
        btn({ variant: "alert", cls: "w-full", attrs: 'data-action="del-last" data-c="' + cIdx + '"' }, "Remover última parcela") + "</div></div></div>";
    }
    return h + "</article>";
  }

  function renderLista(stats) {
    var el = $("lista");
    if (S.banco.length === 0) {
      el.innerHTML = '<div class="rounded-3xl border border-line bg-paper px-6 py-14 text-center">' +
        '<p class="font-serif text-2xl text-ink">A carteira está em branco</p>' +
        '<p class="mx-auto mt-2 max-w-sm text-sm leading-relaxed text-muted">Registre o primeiro contrato para acompanhar parcelas, atrasos e o que vence hoje.</p>' +
        btn({ variant: "primary", cls: "mt-6", attrs: 'data-action="empty-new"' }, "Novo contrato") + "</div>";
      return;
    }
    var hs = stats.hojeStamp;
    var nodes = [];
    S.banco.forEach(function (c, cIdx) {
      if (S.filtro === "hoje") {
        c.lista.forEach(function (p, pIdx) {
          if (p.pago || !dayEquals(p.data, hs)) return;
          nodes.push('<article class="rounded-3xl border border-gold bg-gold-soft p-4 sm:p-5">' +
            '<span class="inline-flex h-7 items-center rounded-full border border-gold px-3 text-xs font-medium uppercase tracking-wider text-gold">Vence hoje</span>' +
            '<h3 class="mt-3 font-serif text-2xl tracking-tight text-ink">' + esc(c.nome) + "</h3>" +
            '<p class="mt-1 text-sm text-muted">Parcela ' + p.numero + " · " + money(p.valor) + "</p>" +
            '<div class="mt-4 grid grid-cols-2 gap-2">' +
            btn({ variant: "primary", attrs: 'data-action="pay" data-c="' + cIdx + '" data-p="' + pIdx + '"' }, "Baixar") +
            btn({ attrs: 'data-action="open" data-id="' + c.id + '"' }, "Ver ficha") + "</div>" +
            btn({ cls: "mt-2 w-full", attrs: 'data-action="parcial" data-c="' + cIdx + '" data-p="' + pIdx + '"' }, "Pagou menos") + "</article>");
        });
        return;
      }
      var atraso = c.lista.some(function (p) { return !p.pago && !dayEquals(p.data, hs) && stampBefore(p.data, hs); });
      if (S.filtro === "devendo") {
        if (!atraso) return;
        nodes.push('<article class="flex flex-col gap-3 rounded-3xl border border-burgundy bg-burgundy-soft p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5">' +
          '<div><p class="text-xs font-medium uppercase tracking-wider text-burgundy">Em atraso</p>' +
          '<h3 class="mt-1 font-serif text-2xl tracking-tight text-ink">' + esc(c.nome) + "</h3></div>" +
          btn({ variant: "alert", attrs: 'data-action="open" data-id="' + c.id + '"' }, "Acessar") + "</article>");
        return;
      }
      nodes.push(clientCard(c, cIdx, hs));
    });
    if (nodes.length === 0) {
      el.innerHTML = '<p class="rounded-3xl border border-line bg-paper px-5 py-10 text-center text-sm text-muted">' +
        (S.filtro === "hoje" ? "Nenhuma parcela vence hoje." : "Nenhum contrato em atraso.") + "</p>";
      return;
    }
    el.innerHTML = nodes.join("");
  }

  function extratoLista(tipo, hs) {
    var h = '<div class="lx"><p class="lx-kicker">Aureum</p><h3 class="lx-title">' +
      (tipo === "resumo" ? "Extrato resumido" : "Extrato completo") + "</h3>" +
      '<p class="lx-sub">Escolha o cliente. A imagem salva o que está nesta folha.</p>';
    if (S.banco.length === 0) return h + '<p class="lx-empty">Nenhum cliente cadastrado.</p></div>';
    h += '<div class="lx-list">';
    S.banco.forEach(function (c) {
      var r = resumir(c, hs);
      h += '<button type="button" class="lx-client" data-action="pick" data-id="' + c.id + '"><span>' +
        '<span class="nome">' + esc(c.nome) + '</span> <span class="info" style="display:block">Parcelas: ' + c.parcelas +
        " · Total: " + money(c.valor) + " · Pagas: " + r.pagas + " · Pendentes: " + r.pendentes +
        '</span></span><span class="lx-go" aria-hidden="true">→</span></button>';
    });
    return h + "</div></div>";
  }

  function extrato(c, tipo, hs) {
    var r = resumir(c, hs);
    var gerado = new Date().toLocaleString("pt-BR");
    var porParcela = c.parcelas > 0 ? money(c.valor / c.parcelas) : "—";
    var titulo = tipo === "resumo" ? "Extrato resumido" : "Extrato completo";
    var h = '<div class="lx"><div class="lx-head"><div class="lx-mark" aria-hidden="true">A</div><div>' +
      '<p class="lx-kicker">Aureum</p><h3 class="lx-title">' + titulo + '</h3><p class="lx-sub">Gerado em ' + gerado + "</p></div></div>";
    if (tipo === "resumo") {
      h += '<p class="lx-name">' + esc(c.nome) + "</p>" +
        '<div class="lx-block"><strong>Tipo:</strong> ' + labelTipo(c.tipo) + " · <strong>Parcelas:</strong> " + c.parcelas +
        " · <strong>Valor total:</strong> " + money(c.valor) + "<br><strong>Pagas:</strong> " + r.pagas +
        " · <strong>Pendentes:</strong> " + r.pendentes + "</div>" +
        '<div class="lx-block ok"><strong>Recebido:</strong> ' + money(r.totalRecebido) + " · <strong>A receber:</strong> " +
        money(r.totalAReceber) + ' · <span class="lx-late">Em atraso: ' + money(r.totalAtrasado) + "</span></div>";
    } else {
      h += '<div class="lx-banner"><h3>' + esc(c.nome) + "</h3></div>" +
        '<div class="lx-block"><strong>Dados do contrato</strong><br>Tipo: ' + labelTipo(c.tipo) +
        "<br>Data de início: " + formatInputDate(c.data) + "<br>Quantidade de parcelas: " + c.parcelas +
        "<br>Valor total: " + money(c.valor) + "<br>Valor por parcela: " + porParcela + "</div>" +
        '<div class="lx-block ok"><strong>Situação atual</strong><br>Parcelas pagas: ' + r.pagas + " de " + c.parcelas +
        "<br>Parcelas pendentes: " + r.pendentes + "<br>Total recebido: " + money(r.totalRecebido) +
        "<br>Total a receber: " + money(r.totalAReceber) + "<br>Valor em atraso: " + money(r.totalAtrasado) + "</div>" +
        "<h4>Detalhamento das parcelas</h4>";
    }
    h += "<table><thead><tr><th>Parcela</th><th>Data</th><th>Valor</th><th>Status</th></tr></thead><tbody>";
    c.lista.forEach(function (p) {
      var st = statusParcela(p, hs);
      h += '<tr><td class="num">' + p.numero + "/" + c.parcelas + '</td><td class="num">' + formatDate(p.data) +
        '</td><td class="num">' + money(p.valor) + '</td><td class="st-' + st + '">' + STATUS_LABEL[st] + (p.parcial ? " parcial" : "") + "</td></tr>";
    });
    h += "</tbody></table>";
    return h + '<p class="lx-foot">Aureum · documento gerado automaticamente para conferência da carteira.</p></div>';
  }

  function renderModal(stats) {
    var root = $("modal-root");
    var m = S.modal;
    if (!m) { root.innerHTML = ""; return; }
    var cliente = m.clienteId != null ? (S.banco.filter(function (x) { return x.id === m.clienteId; })[0] || null) : null;
    var title = m.clienteId == null ? "Selecionar cliente" : (m.tipo === "resumo" ? "Extrato resumido" : "Extrato completo");
    var body;
    if (m.clienteId == null) body = extratoLista(m.tipo, stats.hojeStamp);
    else if (cliente) body = extrato(cliente, m.tipo, stats.hojeStamp);
    else body = '<div class="lx"><p class="lx-empty">Este cliente não está mais na carteira.</p></div>';
    root.innerHTML = '<div class="fixed inset-0 z-50 overflow-y-auto bg-ink/40 px-3 py-6 sm:px-6 sm:py-10" data-action="modal-backdrop">' +
      '<div role="dialog" aria-modal="true" aria-labelledby="extrato-titulo" class="mx-auto w-full max-w-3xl rounded-3xl border border-line bg-paper" data-stop="1">' +
      '<div class="flex flex-wrap items-center justify-between gap-3 border-b border-line px-4 py-4 sm:px-6">' +
      '<h2 id="extrato-titulo" class="font-serif text-2xl tracking-tight text-ink">' + title + "</h2>" +
      '<div class="flex gap-2">' +
      btn({ disabled: S.capturing, attrs: 'data-action="capturar"' }, icon("image-down", "size-4") + (S.capturing ? "Gerando…" : "Imagem")) +
      btn({ attrs: 'data-action="close-modal"' }, "Fechar") + "</div></div>" +
      '<div class="px-4 py-4 sm:px-6 sm:py-6">' +
      (m.clienteId != null ? btn({ cls: "mb-4 w-full", attrs: 'data-action="back"' }, "Voltar à lista") : "") +
      '<div id="capture">' + body + "</div></div></div></div>";
  }

  function renderAsk() {
    var root = $("ask-root");
    var a = S.ask;
    if (!a) { root.innerHTML = ""; return; }
    root.innerHTML = '<div class="fixed inset-0 z-50 grid place-items-center bg-ink/40 px-4" data-action="ask-backdrop">' +
      '<div role="alertdialog" aria-modal="true" class="w-full max-w-sm rounded-3xl border border-line bg-paper p-6" data-stop="1">' +
      '<h3 class="font-serif text-2xl tracking-tight text-ink">' + esc(a.title) + "</h3>" +
      '<p class="mt-2 text-sm leading-relaxed text-muted">' + esc(a.body) + "</p>" +
      (a.input ? '<label class="mt-4 block"><span class="mb-1 block text-xs font-medium uppercase tracking-wider text-muted">' + esc(a.input.label) +
        '</span><input id="ask-input" class="h-12 w-full rounded-xl border border-line bg-canvas px-3 text-base text-ink outline-none focus:border-forest" inputmode="decimal" autocomplete="off" placeholder="' + esc(a.input.placeholder || "") + '"></label>' +
        '<p id="ask-error" role="alert" class="mt-2 text-sm text-burgundy" style="display:none"></p>' : "") +
      '<div class="mt-6 grid ' + (a.noCancel ? "grid-cols-1" : "grid-cols-2") + ' gap-2">' +
      (a.noCancel ? "" : btn({ attrs: 'data-action="ask-cancel"' }, "Cancelar")) +
      btn({ variant: a.primary || a.noCancel ? "primary" : "danger", attrs: 'data-action="ask-yes"' }, esc(a.confirm)) + "</div></div></div>";
  }

  function syncScrollLock() {
    var need = !!(S.modal || S.ask);
    if (need && !scrollLocked) {
      prevOverflow = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      scrollLocked = true;
    } else if (!need && scrollLocked) {
      document.body.style.overflow = prevOverflow;
      scrollLocked = false;
    }
  }

  function render() {
    var stats = carteiraStats(S.banco);
    renderNotice();
    renderKpis(stats);
    renderFiltros();
    // preserva o scroll interno do modal entre re-renderizações
    var scroller = document.querySelector("#modal-root > div");
    var top = scroller ? scroller.scrollTop : 0;
    renderLista(stats);
    renderModal(stats);
    renderAsk();
    var sc2 = document.querySelector("#modal-root > div");
    if (sc2 && top) sc2.scrollTop = top;
    syncScrollLock();
  }

  /* ============ Eventos ============ */
  document.addEventListener("click", function (event) {
    var t = event.target;
    var el = t.closest ? t.closest("[data-action]") : null;
    if (!el) return;
    var action = el.getAttribute("data-action");
    // cliques dentro do diálogo não fecham o fundo
    if ((action === "modal-backdrop" || action === "ask-backdrop") && t.closest("[data-stop]")) return;
    var id = Number(el.getAttribute("data-id"));
    var c = Number(el.getAttribute("data-c"));
    var p = Number(el.getAttribute("data-p"));
    switch (action) {
      case "toggle":
        S.openIds = S.openIds.indexOf(id) !== -1 ? S.openIds.filter(function (x) { return x !== id; }) : S.openIds.concat([id]);
        render(); break;
      case "delete": pedirApagar(id); break;
      case "open": abrirFicha(id); break;
      case "pay": setPago(c, p, true); break;
      case "reverse": setPago(c, p, false); break;
      case "remove": pedirRemover(c, p); break;
      case "add": acrescentar(c); break;
      case "filtro": S.filtro = el.getAttribute("data-id"); render(); break;
      case "close-notice": S.notice = null; render(); break;
      case "empty-new":
        $("form-contrato").style.display = "block";
        window.setTimeout(function () { $("contrato-nome").focus(); }, 50);
        break;
      case "pick": S.modal = { tipo: S.modal.tipo, clienteId: id }; render(); break;
      case "back": S.modal = { tipo: S.modal.tipo, clienteId: null }; render(); break;
      case "close-modal":
      case "modal-backdrop": S.modal = null; render(); break;
      case "capturar": capturar(); break;
      case "ask-cancel":
      case "ask-backdrop": S.ask = null; render(); break;
      case "ask-yes": askYes(); break;
      case "parcial": pedirParcial(c, p); break;
      case "del-last": pedirRemoverUltima(c); break;
      case "novo": toggleForm(); break;
      case "extrato-resumo": abrirExtrato("resumo"); break;
      case "extrato-completo": abrirExtrato("completo"); break;
    }
  });

  function askYes() {
    var a = S.ask;
    if (!a) return;
    if (a.input) {
      var txt = $("ask-input").value;
      var err = a.validate ? a.validate(txt) : null;
      if (err) { var e = $("ask-error"); e.textContent = err; e.style.display = "block"; return; }
      a.onYes(txt);
    } else a.onYes();
  }

  window.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && S.ask && S.ask.input && event.target && event.target.id === "ask-input") { event.preventDefault(); askYes(); return; }
    if (event.key !== "Escape") return;
    if (S.ask) { S.ask = null; render(); }
    else if (S.modal) { S.modal = null; render(); }
  });

  /* ============ Início ============ */
  function init() {
    S.banco = loadBanco();
    $("contrato-data").value = todayInputValue();
    $("hoje-label").textContent = formatHoje();
    $("form-contrato").addEventListener("submit", salvar);
    render();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
